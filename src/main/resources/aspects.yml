# Each entry under `aspects` defines one Aspect. `enabled: false` aspects are
# never assigned to players and are excluded from random selection.
#
# All eight Aspects — fire, tide, frost, wind, earth, thunder, void, and
# blood — are implemented as of Phase 2 Batch B2b. Phase 2 is complete.
aspects:
  fire:
    enabled: true
    display-name: "<red>Fire</red>"
    description: "Aggressive damage and burning enemies."
    rarity: RARE
    weight: 20
    icon: BLAZE_POWDER
    passive:
      name: "Burning Soul"
      description: "Protects you from ordinary fire and lava damage."
      fire-resistance: true
    active:
      name: "Inferno Burst"
      description: "Burns and damages nearby enemies in a close-range burst."
      cooldown-seconds: 25
      radius: 4.0
      damage: 4.0
      burn-ticks: 60
      windup-ticks: 10

  tide:
    enabled: true
    display-name: "<aqua>Tide</aqua>"
    description: "Water, regeneration, and endurance."
    rarity: COMMON
    weight: 40
    icon: HEART_OF_THE_SEA
    passive:
      name: "Ocean's Blessing"
      description: "Grants permanent Water Breathing."
      water-breathing: true
    active:
      name: "Healing Wave"
      description: "Heals you for a fixed amount, up to your maximum health."
      cooldown-seconds: 35
      heal-amount: 4.0

  frost:
    enabled: true
    display-name: "<aqua>Frost</aqua>"
    description: "Slowing and controlling opponents."
    rarity: RARE
    weight: 20
    icon: PACKED_ICE
    passive:
      name: "Frozen Heart"
      description: "Protects you from powder-snow freezing damage."
      freeze-immunity: true
    active:
      name: "Frost Nova"
      description: "Slows nearby enemies in a circular burst around you."
      cooldown-seconds: 24
      radius: 5.0
      slowness-duration-ticks: 60
      slowness-amplifier: 1
      mining-fatigue-enabled: false
      mining-fatigue-ticks: 40

  thunder:
    enabled: true
    display-name: "<yellow>Thunder</yellow>"
    description: "Speed, mobility, and explosive engagement."
    rarity: EPIC
    weight: 10
    icon: TRIDENT
    passive:
      name: "Charged"
      description: "Grants a permanent burst of movement speed."
      speed-boost: true
    active:
      name: "Lightning Dash"
      description: "Propels you forward at high speed in the direction you're facing."
      cooldown-seconds: 18
      max-distance: 7.0
      velocity-per-block: 0.3
      vertical-boost: 0.15
      wall-safety-margin: 0.5

  void:
    enabled: true
    display-name: "<dark_purple>Void</dark_purple>"
    description: "Teleportation, deception, and positioning."
    rarity: LEGENDARY
    weight: 5
    icon: ENDER_PEARL
    passive:
      name: "Voidborn"
      description: "Reduces fall damage you take by half."
      fall-damage-reduction: true
      reduction-percent: 50
    active:
      name: "Void Step"
      description: "Teleports you forward to a safe location in the direction you're facing."
      cooldown-seconds: 22
      max-distance: 7.0

  earth:
    enabled: true
    display-name: "<dark_green>Earth</dark_green>"
    description: "Defense, stability, and holding ground."
    rarity: RARE
    weight: 20
    icon: SHIELD
    passive:
      name: "Stone Skin"
      description: "Grants permanent Resistance."
      resistance-boost: true
    active:
      name: "Earthguard"
      description: "Grants temporary extra Resistance."
      cooldown-seconds: 30
      resistance-duration-ticks: 60
      resistance-amplifier: 1

  wind:
    enabled: true
    display-name: "<white>Wind</white>"
    description: "Agility, jumping, and aerial movement."
    rarity: COMMON
    weight: 40
    icon: FEATHER
    passive:
      name: "Lightfoot"
      description: "Grants a permanent burst of movement speed."
      speed-boost: true
    active:
      name: "Wind Leap"
      description: "Propels you upward and slightly forward."
      cooldown-seconds: 16
      upward-velocity: 1.0
      forward-velocity: 0.6

  blood:
    enabled: true
    display-name: "<dark_red>Blood</dark_red>"
    description: "Sacrifice, aggression, and overwhelming melee power."
    rarity: EPIC
    weight: 10
    icon: REDSTONE
    passive:
      name: "Bloodlust"
      description: "Boosts your outgoing melee damage."
      melee-damage-bonus: true
      melee-damage-bonus-percent: 10
    active:
      name: "Blood Pact"
      description: "Sacrifice health for a temporary extra melee damage boost."
      cooldown-seconds: 28
      sacrifice-amount: 2.0
      bonus-percent: 20
      buff-duration-ticks: 100
