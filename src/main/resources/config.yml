# Aspects plugin — general settings.
#
# config-version identifies the structure of this file, not the plugin version. It lets a future
# plugin update detect and migrate an older config.yml automatically instead of silently
# misreading it. Do not edit this value by hand.
config-version: 1

general:
  debug: false

storage:
  sqlite-file: "playerdata.db"

first-join:
  enabled: true
  sound: "entity.player.levelup"
  particle: "TOTEM_OF_UNDYING"
  particle-count: 20

world-restrictions:
  blocked-worlds: []
  respect-worldguard: true

reroll:
  exclude-current-aspect: true
  reveal-animation-enabled: true

reset:
  # When true, /aspects admin reset <player> immediately assigns a new random Aspect (it may be the
  # same Aspect again — unlike a reroll, a reset does not exclude the player's current Aspect).
  # When false, the player's Aspect data is cleared entirely and they receive a new random Aspect
  # the next time they join, the same way a brand-new player would.
  immediate-reassign: true
